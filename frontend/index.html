<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SentimentIQ — Review Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent-pos: #00e5a0;
      --accent-neg: #ff4566;
      --accent-neu: #f5c400;
      --text: #e8e8f0;
      --muted: #5a5a7a;
      --glow-pos: rgba(0, 229, 160, 0.15);
      --glow-neg: rgba(255, 69, 102, 0.15);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 80vw;
      height: 80vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,160,.06) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
      animation: driftBlob 18s ease-in-out infinite alternate;
    }

    @keyframes driftBlob {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(15vw, 10vh) scale(1.1); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown .7s ease both;
    }

    .badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent-pos);
      border: 1px solid var(--accent-pos);
      border-radius: 100px;
      padding: 4px 14px;
      margin-bottom: 20px;
      opacity: .85;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.03em;
      color: #fff;
    }

    h1 span {
      background: linear-gradient(135deg, var(--accent-pos) 0%, #00c4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 14px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .04em;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 36px 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      animation: fadeUp .7s .2s ease both;
      transition: border-color .4s, box-shadow .4s;
    }

    .card.positive { border-color: var(--accent-pos); box-shadow: 0 0 60px var(--glow-pos), 0 24px 80px rgba(0,0,0,.5); }
    .card.negative { border-color: var(--accent-neg); box-shadow: 0 0 60px var(--glow-neg), 0 24px 80px rgba(0,0,0,.5); }

    .textarea-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
      line-height: 1.7;
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus {
      border-color: rgba(0, 229, 160, .4);
      box-shadow: 0 0 0 3px rgba(0, 229, 160, .08);
    }

    .char-count {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
    }

    .btn {
      width: 100%;
      padding: 16px 28px;
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent-pos), #00c4ff);
      color: #000;
      transition: transform .18s, opacity .18s;
    }

    .btn:hover { transform: translateY(-2px); opacity: .92; }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      transform: scale(0);
      animation: ripple .55s linear;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    .loader {
      display: none;
      gap: 6px;
      justify-content: center;
      align-items: center;
      margin-top: 28px;
    }
    .loader.active { display: flex; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce .9s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,80%,100% { transform: scale(.7); opacity:.4; }
      40%          { transform: scale(1.1); opacity:1; }
    }

    .result-panel {
      margin-top: 28px;
      border-radius: 14px;
      padding: 24px 26px;
      display: none;
      align-items: center;
      gap: 20px;
      animation: popIn .45s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .result-panel.show { display: flex; }

    .result-panel.positive {
      background: linear-gradient(135deg, rgba(0,229,160,.1), rgba(0,196,255,.07));
      border: 1px solid rgba(0,229,160,.3);
    }
    .result-panel.negative {
      background: linear-gradient(135deg, rgba(255,69,102,.1), rgba(255,120,0,.07));
      border: 1px solid rgba(255,69,102,.3);
    }
    .result-panel.neutral {
      background: linear-gradient(135deg, rgba(245,196,0,.08), rgba(200,160,0,.05));
      border: 1px solid rgba(245,196,0,.25);
    }

    .result-icon {
      font-size: 2.4rem;
      flex-shrink: 0;
      filter: drop-shadow(0 0 12px currentColor);
    }

    .result-label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .result-value {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .result-panel.positive .result-value { color: var(--accent-pos); }
    .result-panel.negative .result-value { color: var(--accent-neg); }
    .result-panel.neutral  .result-value { color: var(--accent-neu); }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a0a12;
      border: 1px solid var(--accent-neg);
      color: var(--accent-neg);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 12px 22px;
      border-radius: 100px;
      z-index: 999;
      transition: transform .35s cubic-bezier(.175,.885,.32,1.275);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    footer {
      margin-top: 36px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: .06em;
      animation: fadeUp .7s .4s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 520px) {
      .card { padding: 24px 20px 20px; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <header>
    <div class="badge">AI-Powered(Naive Bayes) · ML</div>
    <h1>Sentiment<span>IQ</span></h1>
    <p class="subtitle">// Amazon review · tone detection engine</p>
  </header>

  <div class="card" id="card">

    <label class="label" for="review">Paste your review</label>
    <div class="textarea-wrap">
      <textarea
        id="review"
        placeholder="e.g. This product completely exceeded my expectations. Fast shipping and amazing build quality…"
        spellcheck="false"
      ></textarea>
      <span class="char-count" id="charCount">0 chars</span>
    </div>

    <button class="btn" id="analyzeBtn" onclick="analyze()">
      ⚡ Analyze Sentiment
    </button>

    <div class="loader" id="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-text-wrap">
        <div class="result-label">Detected Sentiment</div>
        <div class="result-value" id="resultValue"></div>
      </div>
    </div>

  </div>

  <footer>SentimentIQ &nbsp;·&nbsp; powered by your Naive Bayes classifier model</footer>

</div>

<div class="toast" id="toast"></div>

<script>
  const reviewEl  = document.getElementById('review');
  const charCount = document.getElementById('charCount');

  reviewEl.addEventListener('input', () => {
    charCount.textContent = `${reviewEl.value.length} chars`;
  });

  document.getElementById('analyzeBtn').addEventListener('click', function(e) {
    const btn = this;
    const circle = document.createElement('span');
    const diameter = Math.max(btn.clientWidth, btn.clientHeight);
    const radius = diameter / 2;
    const rect = btn.getBoundingClientRect();
    circle.style.cssText = `width:${diameter}px;height:${diameter}px;left:${e.clientX - rect.left - radius}px;top:${e.clientY - rect.top - radius}px;`;
    circle.classList.add('ripple');
    btn.querySelector('.ripple')?.remove();
    btn.appendChild(circle);
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  async function analyze() {
    const review = reviewEl.value.trim();
    if (!review) { showToast('⚠ Please enter a review first.'); return; }

    const btn    = document.getElementById('analyzeBtn');
    const loader = document.getElementById('loader');
    const panel  = document.getElementById('resultPanel');
    const card   = document.getElementById('card');

    panel.classList.remove('show', 'positive', 'negative', 'neutral');
    card.classList.remove('positive', 'negative');
    btn.disabled = true;
    loader.classList.add('active');

    try {
      const response = await fetch('http://127.0.0.1:5000/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ review })
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      const data = await response.json();
      const raw  = (data.prediction || '').toString().toLowerCase().trim();

      let sentiment, icon, className;
      if (raw.includes('positive') || raw === '1' || raw === 'pos') {
        sentiment = 'Positive'; icon = '😊'; className = 'positive';
      } else if (raw.includes('negative') || raw === '0' || raw === 'neg') {
        sentiment = 'Negative'; icon = '😞'; className = 'negative';
      } else {
        sentiment = data.prediction; icon = '😐'; className = 'neutral';
      }

      document.getElementById('resultIcon').textContent  = icon;
      document.getElementById('resultValue').textContent = sentiment;
      panel.classList.add('show', className);
      card.classList.add(className);

    } catch (err) {
      showToast('❌ Could not reach the server. Is Flask running?');
      console.error(err);
    } finally {
      btn.disabled = false;
      loader.classList.remove('active');
    }
  }

  reviewEl.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') analyze();
  });
</script>
</body>
</html>
